# meta-consortium-stm32mp2: Consortium integration for ST OpenSTLinux (STM32MP2).

# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "consortium-stm32mp2"
BBFILE_PATTERN_consortium-stm32mp2 = "^${LAYERDIR}/"
BBFILE_PRIORITY_consortium-stm32mp2 = "6"

LAYERVERSION_consortium-stm32mp2 = "1"
LAYERDEPENDS_consortium-stm32mp2 = "core stm-st-stm32mp"
LAYERSERIES_COMPAT_consortium-stm32mp2 = "scarthgap"
