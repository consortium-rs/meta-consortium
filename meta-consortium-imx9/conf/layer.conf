# meta-consortium-imx9: Consortium integration for NXP i.MX 9 BSPs.

# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "consortium-imx9"
BBFILE_PATTERN_consortium-imx9 = "^${LAYERDIR}/"
BBFILE_PRIORITY_consortium-imx9 = "49"

# Appends that only apply when the layer providing the recipe is present.
# imx-gpu-sdk comes from NXP's meta-imx/meta-imx-sdk.
BBFILES_DYNAMIC += " \
    fsl-sdk-release:${LAYERDIR}/dynamic-layers/fsl-sdk-release/*/*/*.bb \
    fsl-sdk-release:${LAYERDIR}/dynamic-layers/fsl-sdk-release/*/*/*.bbappend \
"

LAYERVERSION_consortium-imx9 = "1"
LAYERDEPENDS_consortium-imx9 = "core freescale-layer"
LAYERSERIES_COMPAT_consortium-imx9 = "wrynose"
